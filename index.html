<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Z v2 — Outpost</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" class="hud"></div>
    <div id="status" class="status"></div>
    <div id="panel" class="panel"></div>
    <div id="zoomcontrols" class="zoomcontrols" aria-label="Compound zoom"><button data-zoom="out" title="Zoom out">-</button><button data-zoom="in" title="Zoom in">+</button></div>
    <button id="modebtn" class="modebtn">🗺 World map</button>
    <button id="newgamebtn" class="newgamebtn" title="Start a new survivor">⟳ New game</button>
    <button id="adminbtn" class="adminbtn" title="Temporary testing tools">⚙ Admin</button>
    <button id="inventorybtn" class="inventorybtn">🎒 Squad</button>
    <button id="researchbtn" class="researchbtn">Research</button>
    <button id="toolshopbtn" class="toolshopbtn">Toolshop</button>
    <button id="forcesbtn" class="forcesbtn">Squads</button>
    <div id="inventory" class="inventory"></div>
    <div id="admin" class="admin"></div>
    <div id="research" class="research"></div>
    <div id="toolshop" class="toolshop"></div>
    <div id="forces" class="forces"></div>
    <div id="start" class="start"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
